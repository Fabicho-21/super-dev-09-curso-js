<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos getElementById</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <selection>
        <h2>Atividade1 Numeros</h2>
        <div>
            <label for="numero1">Numero 1</label>
            <input type="number" id="numero1">

            <label for="numero2">Numero 2</label>
            <input type="number" id="numero2">
        </div>
        <button onclick="exercicio01CompararDoisNumeros()">Qual o maior?</button>
    </selection>

    <selection>
        <h2>Atividade2 Idade</h2>
        <div>
            <label for="nome">Nome </label>
            <input type="text" id="nome">

            <label for="idade">Idade</label>
            <input type="number" id="idade">
        </div>
        <button onclick="exercicio02ClassificarIdade()">Qual Idade?</button>
    </selection>
    <script src="assets/js/exercicio-01-seletores.js"></script>
</body>

</html>
